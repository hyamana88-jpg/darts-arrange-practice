<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darts Trainer">
<title>ダーツ アレンジ練習</title>
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="wrap appShell">
<header class="appHeader"><strong>ダーツ練習</strong><span id="activeModeLabel"></span></header>
<nav class="appNav" aria-label="アプリの画面">
<button class="btn btnSoft" data-screen="practice" onclick="showScreen('practice')">練習</button>
<button class="btn btnSoft" data-screen="stats" onclick="showScreen('stats')">成績</button>
<button class="btn btnSoft" onclick="openScorePicker()">点数を選ぶ</button>
<button class="btn btnSoft" data-screen="settings" onclick="showScreen('settings')">設定</button>
</nav>
<section id="practiceScreen" class="appScreen" aria-label="問題と回答入力">
  <div class="liveScore" aria-label="入力中の点数">
    <div>出題 <strong id="inputStartScore">—</strong></div>
    <div>残り <strong id="inputCurrentScore">—</strong></div>
    <div>入力 <strong id="inputThrowCount">0</strong> / 3</div>
  </div>

<span id="currentScore" hidden>--</span><span id="startScore" hidden>--</span><span id="throwCount" hidden>0</span>
<div class="routeEditor"><div id="throws" class="throws" aria-label="入力したルート"></div>
<div class="controls editControls"><button class="btn btnSoft" onclick="undoThrow()">1投戻す</button><button class="btn btnWarn" onclick="clearThrows()">クリア</button></div></div>
        <div class="boardSection">
          <div id="dartboardHost" class="dartboardHost"></div>
          <div class="boardTools"><span id="boardHint">狙う場所をタップ</span><button class="btn btnSoft dartBtn miss" onclick="addThrow('MISS')">MISS</button></div>
          <div class="controls">
            <button id="submitAnswer" class="btn btnPrimary" onclick="submitAnswer()">回答する</button>
            <button id="impossibleAnswer" class="btn btnSoft" onclick="submitAnswer(true)">3本で上がれない</button>
          </div>
        </div>

</section>
<section id="resultScreen" class="appScreen" aria-label="回答結果" hidden>
<h1>答え合わせ</h1><div id="statusBadge" class="badge info"></div>
<div class="resultBox" role="status"><strong id="resultText"></strong><p id="resultDetail" class="detail"></p></div>
<p id="resultQuestion"></p><p id="submittedRoute" class="mono"></p>
<button class="btn btnSoft correctAnswer" onclick="undoThrow()">回答を直す</button><h2>正解候補</h2><div id="standardAnswer" class="routeItem"></div><div id="routeArea" hidden></div>
<div class="screenActions resultNav" aria-label="回答後の画面">
<button class="btn btnSoft" data-result-screen="result" onclick="showScreen('result')">結果</button>
<button class="btn btnSoft" data-result-screen="explanation" onclick="showScreen('explanation')">解説</button>
<button class="btn btnSoft" data-result-screen="miss" onclick="showScreen('miss')">外した場合</button>
<button class="btn btnPrimary" onclick="nextQuestion()">次の問題</button>
</div>
</section>
<section id="explanationScreen" class="appScreen" aria-label="解説" hidden>
<h2 id="explainTitle"></h2><div id="explainText" class="explainText"></div><ul id="tipList" class="tipList"></ul>
<div class="screenActions resultNav" aria-label="回答後の画面">
<button class="btn btnSoft" data-result-screen="result" onclick="showScreen('result')">結果</button>
<button class="btn btnSoft" data-result-screen="explanation" onclick="showScreen('explanation')">解説</button>
<button class="btn btnSoft" data-result-screen="miss" onclick="showScreen('miss')">外した場合</button>
<button class="btn btnPrimary" onclick="nextQuestion()">次の問題</button>
</div>
</section>
<section id="missScreen" class="appScreen" aria-label="外した場合のアレンジ" hidden>
<h2>外した場合</h2><div id="missPlans" class="detail"></div>

<div class="screenActions resultNav" aria-label="回答後の画面">
<button class="btn btnSoft" data-result-screen="result" onclick="showScreen('result')">結果</button>
<button class="btn btnSoft" data-result-screen="explanation" onclick="showScreen('explanation')">解説</button>
<button class="btn btnSoft" data-result-screen="miss" onclick="showScreen('miss')">外した場合</button>
<button class="btn btnPrimary" onclick="nextQuestion()">次の問題</button>
</div>
</section>
<section id="settingsScreen" class="appScreen" aria-label="ルールと出題設定" hidden>
<section class="card ruleCard" aria-label="ルール選択"><div class="cardBody"><select id="quickMode" aria-label="ルール"><option value="sep_double">ダブルアウト（セパレートブル）</option><option value="fat_master">マスターアウト（ファットブル）</option><option value="fat_single">シングルアウト（ファットブル）</option></select>          <div class="routeGroupTitle">ルール</div>
          <div class="chipRow" id="modeSelector" hidden>
            <label class="chip active"><input type="radio" name="mode" value="fat_single"> ファットブル・シングルアウト</label>
            <label class="chip"><input type="radio" name="mode" value="fat_master"> マスターアウト（ファットブル）</label>
            <label class="chip"><input type="radio" name="mode" value="sep_double" checked> ダブルアウト（セパレートブル）</label>
          </div>

</div></section>
          <div class="practiceSettings">

            <label for="rangePreset">点数帯</label>
            <select id="rangePreset">
              <option value="">自由に指定</option>
              <option value="2-170">2〜170</option>
              <option value="2-60">2〜60</option>
              <option value="61-100">61〜100</option>
              <option value="101-120">101〜120</option>
              <option value="121-170">121〜170</option>
              <option value="171-180">171〜180（マスター／シングルアウト）</option>
            </select>
            <div class="rangeRow">
              <label>下限<input id="rangeMin" type="number" inputmode="numeric" min="2" max="180" value="2"></label>
              <span>〜</span>
              <label>上限<input id="rangeMax" type="number" inputmode="numeric" min="2" max="180" value="170"></label>
              <button class="btn btnSoft" onclick="applyPracticeSettings()">範囲を適用</button>
            </div>
            <label>出題順<select id="questionOrder"><option value="random">ランダム</option><option value="sequential">点数の小さい順</option></select></label>
            <label class="reviewToggle"><input id="reviewPriority" type="checkbox" checked> 間違えた問題を優先して復習</label>
            <p class="detail" id="rangeMessage" role="status"></p>
          </div>

<p id="targetMessage" class="detail" role="status"></p>
</section>
<section id="statsScreen" class="appScreen" aria-label="保存した成績" hidden><h2>成績</h2>
          <div class="stats" aria-label="現在のルールの成績">
            <strong>正答率 <span id="accuracy">—</span></strong>
            <span id="statsCount">0正解 / 0回答</span>
            <div id="reviewScores">復習待ちはありません</div>
            <small>成績はルール別にこの端末へ保存。未回答は集計しません。</small>
          </div>
          <h3 class="mistakeTitle">間違えた点数</h3>
          <div id="mistakeScores" class="mistakeScores"></div>
          <div class="mistakePages"><button id="previousMistakes" class="btn btnSoft" onclick="changeMistakes(-1)">前の点数</button><span id="mistakesPosition"></span><button id="nextMistakes" class="btn btnSoft" onclick="changeMistakes(1)">次の点数</button></div>
          <p id="storageNotice" role="status"></p>

<div class="screenActions"><button class="btn btnSoft" onclick="showScreen('custom')">自分アレンジ</button><button class="btn btnPrimary" onclick="showScreen('practice')">練習に戻る</button></div>
</section>
<section id="customScreen" class="appScreen" aria-label="自分アレンジ登録" hidden><h2>自分アレンジ登録</h2>
          <div class="customBox">
            <div class="formRow">
              <input type="number" id="customScore" min="2" max="180" inputmode="numeric" placeholder="点数" aria-label="登録する点数">
              <input type="text" id="customRoute" placeholder="例: T12,D18" aria-label="登録するルート" autocapitalize="characters" spellcheck="false">
              <button class="btn btnPrimary" onclick="saveCustomRoute()">登録</button>
            </div>
            <p id="customMessage" role="status" class="detail"></p>
            <div class="savedList" id="savedList"></div>
            <div class="controls"><button id="previousSaved" class="btn btnSoft" onclick="changeSaved(-1)">前の登録</button><span id="savedPosition"></span><button id="nextSaved" class="btn btnSoft" onclick="changeSaved(1)">次の登録</button></div>
          </div>

<button class="btn btnPrimary" onclick="showScreen('stats')">成績へ戻る</button>
</section>
<p id="offlineStatus" role="status" hidden></p>
</div>
<dialog id="scorePicker" aria-labelledby="scorePickerTitle">
  <div class="pickerHeader">
    <h2 id="scorePickerTitle">練習する点数を選ぶ</h2>
    <button class="btn btnSoft" onclick="document.getElementById('scorePicker').close()">閉じる</button>
  </div>
  <p class="detail">点数を押すと練習を開始します。上がれない点数も選べます。</p>
  <div id="scoreBands" class="pickerBands" role="group" aria-label="点数の一覧範囲"></div>
  <div id="scoreChoices" class="pickerChoices" role="group" aria-label="練習する点数"></div>
</dialog>
<script src="./practice-core.js" defer></script>
<script src="./dartboard.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
